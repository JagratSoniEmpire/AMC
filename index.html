  <!-- html2pdf.js for multi-page A4 PDF export -->

  <!-- Google Fonts -->

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .font-brand {
      font-family: 'Rajdhani', sans-serif;
    }

    /* Reference image style input line */
    .bse-line-field {
      border-bottom: 1.5px solid #0284c7;
      min-height: 22px;
      display: block;
      width: 100%;
      font-weight: 600;
      color: #072042;
      padding: 0 4px;
    }

    .bse-blank-line {
      border-bottom: 1.5px solid #0284c7;
      height: 20px;
      width: 100%;
      margin-top: 4px;
    }

    /* Print layout: pure A4 format */
    @page {
      size: A4 portrait;
      margin: 8mm 8mm 8mm 8mm;
    }

    @media print {
      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-page-break {
        page-break-before: always;
        break-before: page;
      }
      .avoid-break {
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .bse-doc-container {
        box-shadow: none !important;
        border: none !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
    }
  </style>
</head>

    const SolarPanelIcon = () => (

    const InverterUnitIcon = () => (

        <div className="flex gap-1 mb-0.5">

    const CalendarDateIcon = () => (
      <svg className="w-5 h-5 text-sky-600 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
        <line x1="16" y1="2" x2="16" y2="6" />

    const TechnicianWorkerIcon = () => (
      <div className="w-8 h-8 rounded-full bg-sky-100 border border-sky-400 flex items-center justify-center text-sky-800 shrink-0 shadow-sm">
        <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M12 2a4 4 0 0 0-4 4v1H6a2 2 0 0 0-2 2v2h16V9a2 2 0 0 0-2-2h-2V6a4 4 0 0 0-4-4zm-2 13.5a4.5 4.5 0 0 0-4.5 4.5v2h13v-2a4.5 4.5 0 0 0-4.5-4.5h-4z"/>
        </svg>
      </div>
    );

    const ShieldSignIcon = () => (
      <div className="w-8 h-8 rounded-full bg-sky-100 border border-sky-400 flex items-center justify-center text-sky-800 shrink-0 shadow-sm">
        <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
        </svg>
      </div>
    );

    // Initial default report state adhering strictly to requirements
    const INITIAL_FORM_DATA = {
      projectName: 'Karnavati Club Solar Rooftop',
      projectAddress: 'S.G. Highway, Near Golden Triangle, Bodakdev',
      siteLocation: 'Ahmedabad',
      inspectionDate: '2026-10-21',
      reportNo: 'BSE-2026-8849',
      installedCapacity: '200.2 kWp',
      pvMake: 'Adani Solar',
      pvCapacity: '325 Wp Mono',
      pvQuantity: '616',
      inverterMake: 'ABB String Inverter',
      inverterCapacity: '4 x 50 kW',
      visitTypes: {
        Monthly: false,
        Quartely: true, // exact spelling preserved
        'Half-Yearly': false,
        'Annual Breakdown': false
      },
      checklists: {
        solarPanel: [
          { id: 'sp1', label: 'Panel surface condition and physical damage.', status: 'Pass', remarks: 'Clean glass, no cracks' },
          { id: 'sp2', label: 'Dust, dirt, and cleaning requirements.', status: 'Pass', remarks: 'Routine dust removed' },
          { id: 'sp3', label: 'Cracks, discoloration, and possible hotspots.', status: 'Pass', remarks: 'IR thermography normal' },
          { id: 'sp4', label: 'Shading and surrounding obstructions.', status: 'Pass', remarks: 'No shadows detected' },
          { id: 'sp5', label: 'Mounting condition and visible cable damage.', status: 'Pass', remarks: 'Cable ties intact' }
        ],
        inverter: [
          { id: 'inv1', label: 'Inverter operating status.', status: 'Pass', remarks: 'All 4 units online & generating' },
          { id: 'inv2', label: 'Error codes and warning indicators.', status: 'Pass', remarks: 'Zero active alerts' },
          { id: 'inv3', label: 'Display readings and operational parameters.', status: 'Pass', remarks: 'LCD active' },
          { id: 'inv4', label: 'Cooling system and ventilation.', status: 'Pass', remarks: 'Fans cleared of dust' },
          { id: 'inv5', label: 'Visible damage and loose connections.', status: 'Pass', remarks: 'Torque inspected' }
        ],
        structure: [
          { id: 'st1', label: 'Mounting structure stability.', status: 'Pass', remarks: 'Rigid HDG aluminium rail' },
          { id: 'st2', label: 'Corrosion, rust, and structural damage.', status: 'Pass', remarks: 'Zero corrosion observed' },
          { id: 'st3', label: 'Bolts, nuts, and fastener condition.', status: 'Pass', remarks: 'SS304 hardware OK' },
          { id: 'st4', label: 'Roof mounting and waterproofing condition.', status: 'Pass', remarks: 'EPDM gaskets sound' },
          { id: 'st5', label: 'Panel alignment and mechanical integrity.', status: 'Pass', remarks: 'Perfect azimuth angle' }
        ],
        electrical: [
          { id: 'el1', label: 'DC voltage measurement.', status: 'Pass', reading: '685', unit: 'V', remarks: 'String Voc balanced' },
          { id: 'el2', label: 'DC current measurement.', status: 'Pass', reading: '28.4', unit: 'A', remarks: 'MPPT operating' },
          { id: 'el3', label: 'AC voltage measurement.', status: 'Pass', reading: '415', unit: 'V', remarks: '3-Phase nominal' },
          { id: 'el4', label: 'AC current measurement.', status: 'Pass', reading: '69.2', unit: 'A', remarks: 'Feed to main panel' },
          { id: 'el5', label: 'Earthing and grounding condition.', status: 'Pass', reading: '1.8', unit: 'Ω', remarks: 'Pit resistance tested' },
          { id: 'el6', label: 'Cable insulation and visible wiring condition.', status: 'Pass', reading: '', unit: '', remarks: 'XLPE solar cable OK' },
          { id: 'el7', label: 'Electrical connections and protection devices.', status: 'Pass', reading: '', unit: '', remarks: 'SPD and MCCB tested' }
        ]
      },
      technicianName: 'Rajesh K. Sharma',
      signatureData: ''
    };

    function App() {
      const [formData, setFormData] = useState(() => {
        const saved = localStorage.getItem('BSE_SOLAR_REPORT_EXACT_UI');
        return saved ? JSON.parse(saved) : INITIAL_FORM_DATA;
      });

      const [viewMode, setViewMode] = useState('both'); // 'form', 'preview', or 'both'
      const [notice, setNotice] = useState('');
      const canvasRef = useRef(null);
      const isDrawing = useRef(false);

      const showToast = (text) => {
        setNotice(text);
        setTimeout(() => setNotice(''), 3500);
      };

      // Signature Pad Handlers
      const clearSignature = () => {
        const canvas = canvasRef.current;
        if (canvas) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        setFormData(prev => ({ ...prev, signatureData: '' }));
      };

      const startDrawing = (e) => {
        isDrawing.current = true;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        ctx.beginPath();
        ctx.moveTo(clientX - rect.left, clientY - rect.top);
      };

      const draw = (e) => {
        if (!isDrawing.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#072042';
        ctx.lineTo(clientX - rect.left, clientY - rect.top);
        ctx.stroke();
      };

      const stopDrawing = () => {
        if (isDrawing.current) {
          isDrawing.current = false;
          const canvas = canvasRef.current;
          if (canvas) {
            setFormData(prev => ({ ...prev, signatureData: canvas.toDataURL('image/png') }));
          }
        }
      };

      // Actions
      const handleSaveDraft = () => {
        localStorage.setItem('BSE_SOLAR_REPORT_EXACT_UI', JSON.stringify(formData));
        showToast('✓ Inspection Report saved to browser storage!');
      };

      const handleLoadDraft = () => {
        const saved = localStorage.getItem('BSE_SOLAR_REPORT_EXACT_UI');
        if (saved) {
          setFormData(JSON.parse(saved));
          showToast('✓ Saved draft reloaded!');
        } else {
          alert('No saved draft found.');
        }
      };

      const handleReset = () => {
        if (confirm('Reset all fields to blank?')) {
          setFormData({
            ...INITIAL_FORM_DATA,
            projectName: '',
            projectAddress: '',
            siteLocation: '',
            reportNo: 'BSE-' + Math.floor(100000 + Math.random() * 900000),
            installedCapacity: '',
            pvMake: '',
            pvCapacity: '',
            pvQuantity: '',
            inverterMake: '',
            inverterCapacity: '',
            technicianName: '',
            signatureData: '',
            visitTypes: { Monthly: false, Quartely: false, 'Half-Yearly': false, 'Annual Breakdown': false },
            checklists: {
              solarPanel: INITIAL_FORM_DATA.checklists.solarPanel.map(i => ({ ...i, status: '', remarks: '' })),
              inverter: INITIAL_FORM_DATA.checklists.inverter.map(i => ({ ...i, status: '', remarks: '' })),
              structure: INITIAL_FORM_DATA.checklists.structure.map(i => ({ ...i, status: '', remarks: '' })),
              electrical: INITIAL_FORM_DATA.checklists.electrical.map(i => ({ ...i, status: '', reading: '', remarks: '' }))
            }
          });
          clearSignature();
          showToast('Form reset complete.');
        }
      };

      const handlePrint = () => {
        window.print();
      };

      const handlePrintBlank = () => {
        const original = JSON.parse(JSON.stringify(formData));
        setFormData({
          projectName: '',
          projectAddress: '',
          siteLocation: '',
          inspectionDate: '',
          reportNo: '',
          installedCapacity: '',
          pvMake: '',
          pvCapacity: '',
          pvQuantity: '',
          inverterMake: '',
          inverterCapacity: '',
          technicianName: '',
          signatureData: '',
          visitTypes: { Monthly: false, Quartely: false, 'Half-Yearly': false, 'Annual Breakdown': false },
          checklists: {
            solarPanel: INITIAL_FORM_DATA.checklists.solarPanel.map(i => ({ ...i, status: '', remarks: '' })),
            inverter: INITIAL_FORM_DATA.checklists.inverter.map(i => ({ ...i, status: '', remarks: '' })),
            structure: INITIAL_FORM_DATA.checklists.structure.map(i => ({ ...i, status: '', remarks: '' })),
            electrical: INITIAL_FORM_DATA.checklists.electrical.map(i => ({ ...i, status: '', reading: '', remarks: '' }))
          }
        });
        setTimeout(() => {
          window.print();
          setTimeout(() => setFormData(original), 1000);
        }, 200);
      };

      const handleDownloadPDF = () => {
        const element = document.getElementById('report-document');
        if (!element) return;
        showToast('Compiling high-resolution PDF...');

        const opt = {
          margin: [6, 6, 6, 6],
          filename: `${formData.reportNo || 'BSE_AMC'}_Inspection_Report.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, logging: false },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'] }
        };

        html2pdf().set(opt).from(element).save().then(() => {
          showToast('✓ PDF download started!');
        });
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-100">
          
          {/* NAVIGATION BAR */}
          <header className="no-print bg-gradient-to-r from-bse-darkNavy via-bse-navy to-[#034078] text-white sticky top-0 z-50 border-b-4 border-sky-400 shadow-lg">
            <div className="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-b from-sky-400 to-sky-700 p-0.5 shadow flex items-center justify-center">
                  <span className="font-brand font-black text-xl text-white tracking-tighter">BSE</span>
                </div>
                <div>
                  <h1 className="text-lg md:text-xl font-bold font-brand tracking-wider flex items-center gap-2">
                    BLUE SHIELD ENERGY
                    <span className="text-[10px] font-sans bg-sky-500/30 text-sky-200 border border-sky-400/40 px-2 py-0.5 rounded">AMC Generator</span>
                  </h1>
                  <p className="text-[11px] text-sky-300 font-medium">Powering Your Future</p>
                </div>
              </div>

              {/* View Selector */}
              <div className="flex items-center gap-1 bg-black/30 p-1 rounded-lg border border-white/10">
                <button
                  type="button"
                  onClick={() => setViewMode('form')}
                  className={`px-3 py-1 rounded text-xs font-semibold transition ${viewMode === 'form' ? 'bg-sky-500 text-white' : 'text-slate-300 hover:text-white'}`}
                >
                  Editor
                </button>
                <button
                  type="button"
                  onClick={() => setViewMode('preview')}
                  className={`px-3 py-1 rounded text-xs font-semibold transition ${viewMode === 'preview' ? 'bg-sky-500 text-white' : 'text-slate-300 hover:text-white'}`}
                >
                  Document View
                </button>
                <button
